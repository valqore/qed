[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "valqore-qed"
version = "1.0.0"
description = "Self-hosted policy and evidence kernel for AI-agent actions"
requires-python = ">=3.12"
# SPEC 25.1. An SPDX expression, not the old `{text = ...}` table: setuptools
# 77 deprecated the table form (PEP 639) and a `License ::` classifier
# alongside this key is now an error, which is why there is no such classifier
# below. SPEC 24.2 (Valqore patent scope) closed on 2026-10-08 with no filings
# and nothing pending, so the Apache-2.0 patent grant in 3 grants nothing
# Valqore holds.
license = "Apache-2.0"
# Declared because GOVERNANCE.md's "who decides" section points here, and a
# governance document naming a maintainer the package metadata does not is a
# claim with nothing behind it.
authors = [{ name = "Tunc Celik", email = "tunc@valqore.io" }]
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7",
    "cryptography>=42",
    "typer>=0.27.3",
    "pyyaml>=6.0.3",
    "python-ulid>=2",
    "regex>=2026.9.29",
    # Week 2. All four are in SPEC 20.3's allowed set for the kernel wheel.
    # `mcp` is pinned to 2.x: the 2.0 SDK replaced the decorator-based
    # low-level server with the `on_*` callbacks qed/adapters/mcp/proxy.py
    # uses, so a 1.x resolution would not import.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    # Week 3. JOSE for delegation tokens (SPEC §6). `authlib` is what §20.3
    # named, but `authlib.jose` is deprecated in 1.8 in favour of `joserfc` by
    # the same author, and it warns on import -- which this suite treats as an
    # error. `joserfc` is the successor, not an additional dependency.
    "joserfc>=1.0,<2",
    # Week 3. SPEC 20.3 allows it; the device-flow refresh token goes to the
    # OS keychain, and on a box without one to a 0600 file with a warning.
    "keyring>=25.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "types-PyYAML",
    # Validates the OSCAL export against the vendored NIST schema
    # (tests/oscal/). Test-only; SPEC 10.8 allows JSON Schema in place of
    # oscal-cli, which would add a JVM to CI.
    "jsonschema>=4.22",
    # Week 10. SPEC 17 asks for "fuzz on parsers" and 20.3 already lists
    # `hypothesis` in the dev/test set, so this is not a new dependency so much
    # as the one that was reserved for it. `tests/test_fuzz_parsers.py`.
    "hypothesis>=6.170.0",
    # Week 10. SPEC 24.1 names PyInstaller as the mechanism for the Homebrew
    # single-file binary; 20.3 is amended to list it, per 23's "no new
    # dependency without a spec update". Dev/test only -- it is never imported
    # by `qed`, and `tests/deploy/test_binary.py` is what needs it. The
    # `deploy` CI job fails on any skip, so it has to be installed there
    # rather than skipped politely.
    "pyinstaller>=6.10",
    # Week 11. SPEC 26 names mkdocs-material as the docs site. Dev/test only --
    # never imported by `qed`; `tests/docs/test_site.py` builds the site with
    # `--strict`, which is the only check that catches a dead cross-reference.
    #
    # Capped below MkDocs 2.0 deliberately. The Material maintainers' own notice
    # says 2.0 removes the plugin system, rewrites theming, offers no migration
    # path and is currently unlicensed. An uncapped range would turn that into a
    # surprise failure on an unrelated commit.
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7,<10",
]
# SPEC 19, 20.4. The web pages are AGPL-3.0 and ship as their own wheel from
# their own repository, so that a third party cannot offer a hosted
# QED-as-a-service without releasing their changes while a customer running it
# internally is unaffected. Keeping it an extra is what keeps this wheel
# Apache-2.0: `qed/api/ui.py` knows how to find the package and nothing about
# what is inside it.
ui = [
    "qed-ui>=0.1",
]
# SPEC 20.3. Postgres is for more than one replica sharing a chain (SPEC 15);
# SQLite needs nothing and runs the whole product on one machine, which is why
# this is an extra and not a dependency. `[binary]` so an install needs no
# compiler.
postgres = [
    "psycopg[binary]>=3.2",
]
# SPEC 10.4. The S3 object-lock checkpoint publisher, which is the only anchor
# that is genuinely write-once: an instance with no such publisher configured
# never imports boto3.
s3 = [
    "boto3>=1.34",
]
# SPEC 10.4. The GCS retention checkpoint publisher -- the GCP twin of the one
# above, and the second anchor that is genuinely write-once: a *locked*
# retention policy can never be shortened or removed by anybody. An instance
# with no such publisher configured never imports google-cloud-storage.
gcs = [
    "google-cloud-storage>=2.18",
]

[project.scripts]
qed = "qed.cli:main"
# `vqed` is the same entry point under a second name, for a machine where `qed`
# is taken or ambiguous -- `qed` is also a Unix text editor, the ancestor of
# `ed`, which no current distribution ships but which a reader may know. It is
# an alias and not a rename: `qed` stays the documented command, the package
# name and the repository, and the three published constants that carry the
# product name (`qed-pack-bundle/1`, the RFC 9457 type base and the OSCAL
# property namespace) are frozen in evidence format 1.0 and cannot follow a
# rename anyway (ADR-0015). Typer takes the program name from `argv[0]`, so
# `vqed --help` describes itself as `vqed` with no code change.
vqed = "qed.cli:main"

[tool.setuptools.packages.find]
include = ["qed*"]

[tool.setuptools.package-data]
# Every non-Python file `qed` reads at runtime. Each one is a FileNotFoundError
# in an installed wheel if it is missing here, and the wheel is how the
# container is built -- so a file left out of this list is a container that
# builds cleanly and dies on startup. `tests/test_packaging.py` checks the list
# against what is actually on disk rather than trusting it.
qed = [
    "core/policy/packs/*/*.yaml",
    "infra/storage/migrations/*.sql",
    "compliance/*.yaml",
    "compliance/packs/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
# RUF001-003: docstrings and prose use typographic dashes on purpose; the
# only places ASCII is mandatory are strings printed to a terminal, and
# tests/cli asserts that.
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN", "B"]
"**/conftest.py" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
# `examples` is in scope deliberately: an example is code a reader copies into
# their own repository, so an example that does not type-check teaches the
# habit. Week 11 added `examples/onboarding/gap_report.py` and found it had
# shipped with an `object` parameter and a `type: ignore` because nothing
# checked it.
files = ["qed", "packages/qed-verify/qed_verify", "examples"]
mypy_path = "packages/qed-verify"

[[tool.mypy.overrides]]
module = ["ulid.*", "regex.*", "yaml.*"]
ignore_missing_imports = true

# The agent frameworks the SDK examples demonstrate. Neither is a dependency of
# anything -- `examples/sdk/*.py` import them inside a `try` and fall back to
# calling the same function directly, because the point being demonstrated is
# not the framework. So the modules are legitimately absent in every CI cell.
[[tool.mypy.overrides]]
module = ["langchain_core.*", "crewai.*"]
ignore_missing_imports = true

# `psycopg` is an optional extra, so most CI cells type-check without it
# installed -- which is the configuration almost every deployment has, and the
# one those cells exist to prove works. Without this, `mypy` fails there and
# passes on the one job that happens to have the extra, which is the worst way
# round. `strict` still applies to everything we wrote; this only says the
# module may be absent.
[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true

# Same reasoning for boto3, which only the S3 object-lock checkpoint publisher
# needs. It also ships no type stubs of its own, so this says both things at
# once: it may be absent, and it is untyped when present.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# And again for google-cloud-storage, which only the GCS retention checkpoint
# publisher needs. Same two things at once: it may be absent, and it carries no
# `py.typed` marker when present.
[[tool.mypy.overrides]]
module = ["google.cloud", "google.cloud.*", "google.api_core", "google.api_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/qed-verify/tests"]
pythonpath = [".", "packages/qed-verify"]
filterwarnings = ["error"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    # Builds a container image, so it is minutes rather than seconds and needs
    # a Docker daemon. Run with `-m slow`; deselect with `-m "not slow"`.
    "slow: needs a container build or another external service",
    # SPEC 18's p95 budget and SPEC 849's throughput floor. Timing assertions,
    # so they are the tests most likely to be noisy on a shared runner -- run
    # with `-m perf`, skipped by `-m "not perf"`.
    "perf: a timing assertion",
]
