# agent-baseline — data and egress (SPEC §4.6, AG-DAT-*)
#
# These match on `action.params_redacted` only. Raw parameters never reach the
# engine (SPEC §4.4), so a rule here sees what an approver would see. The
# masking pass in qed/core/evidence/masking.py runs on the way *into* the
# chain, not on the way into the engine — a secret the adapter sent in a
# redacted field is still visible to AG-DAT-001 and still gets blocked.

- rule_id: AG-DAT-001
  name: Secret material in action parameters
  severity: CRITICAL
  mode: enforce
  when:
    any:
      - field: action.params_redacted.body
        regex: "(?i)(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,})"
      - field: action.params_redacted.sql
        regex: "(?i)(password|secret|private[_ ]key)\\s*="
      - field: action.params_redacted.command
        regex: "(?i)(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[abprs]-)"
  verdict: BLOCK
  message: "The parameters of this action contain secret material."
  fix: "Reference the secret from the credential broker instead of passing it inline."
  compliance:
    - { framework: eu_ai_act, control: "Art. 15" }
    - { framework: owasp_agentic, control: "ASI05" }
    - { framework: owasp_llm, control: "LLM02" }
    - { framework: soc2, control: "CC6.1" }

- rule_id: AG-DAT-002
  name: Personal data in action parameters
  severity: HIGH
  mode: enforce
  when:
    any:
      - field: action.params_redacted.body
        regex: "[\\w.+-]+@[\\w-]+\\.[\\w.-]*\\w"
      - field: action.params_redacted.sql
        regex: "(?i)\\b(ssn|national_id|date_of_birth|passport)\\b"
  verdict: REQUIRE_APPROVAL
  approval:
    approvers: [privacy-oncall]
    timeout: 30m
    window_max: 15m
  message: "The parameters of this action appear to contain personal data."
  fix: "Remove the personal data, or have the privacy rota approve the transfer."
  compliance:
    - { framework: eu_ai_act, control: "Art. 10" }
    - { framework: iso_27001, control: "A.5.34" }
    - { framework: soc2, control: "P4.1" }

- rule_id: AG-DAT-003
  name: Egress to a host that is not on the allow list
  severity: HIGH
  # Shadow until the allow list below is edited for the installation. Shipping
  # it in enforce with someone else's host list would block real traffic on day
  # one and teach the operator to switch the whole pack off.
  mode: shadow
  applies_to:
    kinds: [http]
  when:
    all:
      # An `http` action's target may be a URL or a cloud resource id
      # (SPEC 3.1: "URI-ish resource id"). Only a URL names an egress host, so
      # the rule looks at URLs and leaves `aws:ec2:sg-123` to AG-BLR-*.
      - { field: action.target, glob: "*://*" }
      - not:
          field: action.target
          glob:
            - "*.amazonaws.com*"
            - "*.googleapis.com*"
            - "*.azure.com*"
            - "*.github.com*"
            - "*.internal*"
            - "*://localhost*"
            - "*://127.0.0.1*"
  verdict: REQUIRE_APPROVAL
  approval:
    approvers: [security-oncall]
    timeout: 10m
  message: "Outbound request to a host that is not on the egress allow list."
  fix: "Add the host to AG-DAT-003 in your policy directory, or route it through a proxy."
  compliance:
    - { framework: eu_ai_act, control: "Art. 15" }
    - { framework: owasp_agentic, control: "ASI06" }
    - { framework: owasp_mcp, control: "MCP04" }

- rule_id: AG-DAT-007
  name: Ingress opened to the whole internet
  severity: CRITICAL
  mode: enforce
  when:
    any:
      - field: action.params_redacted.cidr
        equals: "0.0.0.0/0"
      - field: action.params_redacted.body
        contains: "0.0.0.0/0"
      - field: action.params_redacted.cidr
        equals: "::/0"
  verdict: BLOCK
  message: "This opens ingress from 0.0.0.0/0."
  fix: "Name the source ranges you actually need."
  compliance:
    - { framework: eu_ai_act, control: "Art. 15" }
    - { framework: nist_csf, control: "PR.AC-5" }
    - { framework: soc2, control: "CC6.6" }
