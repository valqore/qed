# agent-baseline — blast radius (SPEC §4.6, AG-BLR-*)
#
# These five read the adapter's hints and the derived score. The score itself is
# a pure table in qed/core/policy/blast_radius.py, documented in
# docs/blast-radius.md; it is deliberately not a count of affected resources.

- rule_id: AG-BLR-001
  name: Account-wide or global action in production
  severity: CRITICAL
  mode: enforce
  applies_to:
    environments: [prod]
  when: { field: context.blast_radius_hints.scope, in: [account, global] }
  verdict: BLOCK
  message: "Account-wide or global change in production."
  fix: "Scope the action to the resources you mean, or run it from a change window."
  compliance:
    - { framework: eu_ai_act, control: "Art. 14" }
    - { framework: nist_ai_rmf, control: "MANAGE-2.2" }
    - { framework: owasp_agentic, control: "ASI04" }
    - { framework: soc2, control: "CC8.1" }
    - { framework: dora, control: "Art. 9" }

- rule_id: AG-BLR-002
  name: Multi-resource delete
  severity: HIGH
  mode: enforce
  when:
    all:
      - { field: context.blast_radius_hints.deletes, equals: true }
      - { field: context.blast_radius_hints.scope, in: [multi_resource, account, global] }
  verdict: REQUIRE_APPROVAL
  approval:
    approvers: [sre-oncall]
    timeout: 10m
    window_max: 30m
  message: "This deletes more than one resource at a time."
  fix: "Delete one resource per call, or request approval with an explicit intent."
  compliance:
    - { framework: eu_ai_act, control: "Art. 14" }
    - { framework: owasp_agentic, control: "ASI04" }
    - { framework: soc2, control: "CC8.1" }

- rule_id: AG-BLR-003
  name: Destructive action in production
  severity: HIGH
  mode: enforce
  applies_to:
    kinds: [mcp_tool, http, shell]
    environments: [prod]
  when:
    any:
      - { field: context.blast_radius_hints.deletes, equals: true }
      - { field: action.params_redacted.sql, regex: "(?i)^\\s*(drop|truncate|alter|delete)\\b" }
      - { field: action.name, regex: "(?i)(drop|truncate|destroy|terminate|purge)" }
  verdict: REQUIRE_APPROVAL
  approval:
    approvers: [sre-oncall, dba]
    timeout: 10m
    window_max: 30m
    escalate_to: [platform-leads]
    escalate_after: 5m
  message: "Destructive change to a production resource."
  fix: "Run it against staging first, or request approval with an explicit intent."
  compliance:
    - { framework: eu_ai_act, control: "Art. 14" }
    - { framework: nist_ai_rmf, control: "GOVERN-1.5" }
    - { framework: owasp_agentic, control: "ASI04" }
    - { framework: soc2, control: "CC8.1" }
    - { framework: dora, control: "Art. 9" }

- rule_id: AG-BLR-004
  name: Identity, secret or policy mutation
  severity: CRITICAL
  mode: enforce
  when:
    all:
      - { field: context.blast_radius_hints.writes, equals: true }
      - field: action.target
        regex: "(?i)(iam|secret|credential|kms|role|policy|serviceaccount|sso|mfa)"
  verdict: REQUIRE_APPROVAL
  approval:
    approvers: [security-oncall]
    timeout: 10m
    window_max: 15m
  message: "This changes the identity, secrets or policy surface."
  fix: "Have a human on the security rota make this change, or approve it explicitly."
  compliance:
    - { framework: eu_ai_act, control: "Art. 14" }
    - { framework: nist_ai_rmf, control: "GOVERN-1.5" }
    - { framework: owasp_agentic, control: "ASI02" }
    - { framework: soc2, control: "CC6.3" }
    - { framework: dora, control: "Art. 9" }

- rule_id: AG-BLR-005
  name: Derived blast radius above the oversight threshold
  severity: HIGH
  mode: enforce
  when: { field: derived.blast_radius, gt: 60 }
  verdict: REQUIRE_APPROVAL
  approval:
    approvers: [sre-oncall]
    timeout: 10m
    window_max: 30m
  message: "The blast-radius score for this action is above 60."
  fix: "Narrow the scope until the score drops, or request approval."
  compliance:
    - { framework: eu_ai_act, control: "Art. 14" }
    - { framework: nist_ai_rmf, control: "MANAGE-2.2" }
