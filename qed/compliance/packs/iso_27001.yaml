# agent-governance kernel evidences a handful.
framework: iso_27001
source: https://www.iso.org/standard/27001
version: "2022"

catalogue: partial
scope: The Annex A controls this rule set maps to.

controls:
  - id: A.5.34
    label: Privacy and protection of personally identifiable information
