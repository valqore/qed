name: Release

# Builds, signs and attaches everything a release is made of, from a `v*` tag.
#
# **Publishing is off until somebody turns it on.** SPEC §24.1's name
# reservations -- PyPI `valqore-qed` and `qed-verify`, the GHCR path, the
# Homebrew tap -- are not done, and publishing is the irreversible step: a
# wheel on PyPI cannot be unpublished and reused, and an image pushed under a
# name somebody else later owns is a mess. So every job here runs on every tag
# and produces every artifact, and the three steps that *push* are each gated
# on a repository variable:
#
#   PUBLISH_GHCR=true   -> push the image, sign it, push the Helm chart
#   PUBLISH_PYPI=true   -> publish both wheels via trusted publishing
#
# Settings -> Secrets and variables -> Actions -> Variables. Until then a tag
# still gets a verified build, an SBOM, a signed-off test run and a GitHub
# Release with the wheels and the chart attached -- which is what proves the
# pipeline before it is pointed at the world.
#
# One-time, before the first publish: make the GHCR package public (Packages ->
# qed -> Package settings -> Change visibility), and add PyPI trusted
# publishers for both projects.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build, without the leading v (e.g. 0.6.0)"
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/valqore/qed

jobs:
  # ---------------------------------------------------------------------------
  # The tag and the source have to agree before anything is built. This is the
  # guard rail for a mistake already made once on the engine: tagging before
  # bumping, which produces a release whose artifacts all report the previous
  # version and cannot be corrected without deleting the tag.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve the version
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.tag }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      - name: The tag must match the source
        run: |
          set -euo pipefail
          declared=$(python -c "import re,pathlib; print(re.search(r'VERSION: Final = \"([^\"]+)\"', pathlib.Path('qed/version.py').read_text()).group(1))")
          if [ "$declared" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "::error::qed/version.py says $declared, the tag says ${{ steps.resolve.outputs.version }}."
            echo "::error::Bump qed/version.py (and let tests/test_version.py check the rest) BEFORE tagging."
            echo "::error::A release whose artifacts report the previous version cannot be fixed without deleting the tag."
            exit 1
          fi
          echo "ok: $declared"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e packages/qed-verify

      # Every version literal in the repo, including the ones Python cannot
      # import: the chart's appVersion, the Dockerfile label, the docs.
      - name: Every stated version agrees
        run: pytest tests/test_version.py -q

      - name: Lint, types, tests
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest -q -m "not slow and not perf"

  # ---------------------------------------------------------------------------
  wheels:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build both distributions
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          # Two projects from one tag: the kernel and the standalone verifier.
          # `qed-verify` is the one an auditor runs, and it is a separate
          # distribution precisely so they can install it without installing
          # the thing it is checking.
          python -m build --outdir dist .
          python -m build --outdir dist packages/qed-verify

      - name: The wheel contains the data files it reads
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install dist/valqore_qed-*.whl
          # The failure this catches shipped once: a wheel missing
          # `compliance/frameworks.yaml` started, bound its port and died on
          # the first request. Importing from the installed package, with the
          # source tree out of the way, is the only way to see it.
          cd "$(mktemp -d)"
          python - <<'PY'
          import pathlib

          from qed.compliance.loader import frameworks
          from qed.core.policy.loader import baseline_pack_dir

          assert frameworks(), "frameworks.yaml is not in the wheel"
          packs = list(pathlib.Path(baseline_pack_dir()).glob("*.yaml"))
          assert packs, "the baseline policy pack is not in the wheel"
          print(f"ok: {len(frameworks())} frameworks, {len(packs)} pack files")
          PY

      # Two artifacts, because PyPI's trusted publishing is scoped per project
      # and an upload carrying the other project's files is rejected.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-qed
          path: dist/valqore_qed-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: dist-qed-verify
          path: dist/qed_verify-*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Each arch on its own runner. No QEMU: the builder stage compiles nothing,
  # but emulating an arm64 pip install still costs minutes for no benefit when
  # a native runner is free.
  image:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: vars.PUBLISH_GHCR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two steps rather than one with a conditional `outputs:`, because the
      # two cases want different things: a local image to start, or an
      # untagged push by digest for the manifest list to merge. A ternary in
      # YAML that produced an empty `tags:` was the first version of this and
      # it was not obvious why it failed.
      - name: Build and load, for a tag that publishes nothing
        id: local
        if: vars.PUBLISH_GHCR != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          load: true
          build-args: |
            BUILDER_IMAGE=public.ecr.aws/docker/library/python:3.12-slim-bookworm
          tags: ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}

      - name: Build and push by digest
        id: build
        if: vars.PUBLISH_GHCR == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            BUILDER_IMAGE=public.ecr.aws/docker/library/python:3.12-slim-bookworm
          # oci-mediatypes so the merge step can build an OCI *index*: a Docker
          # manifest list cannot carry the index-level source annotation
          # GitHub's package-to-repo linker reads.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true

      - name: It runs
        if: vars.PUBLISH_GHCR != 'true'
        # The static Dockerfile assertions passed once on an image that could
        # not import pydantic, so the image is started here rather than only
        # inspected. `load: true` puts it in the local daemon, and each runner
        # is its own architecture, so this is a native run.

        run: |
          set -euo pipefail
          # Captured, not piped. Under `pipefail` *any* consumer that can
          # exit early kills the producer with SIGPIPE and fails the step
          # on an image that is fine -- `write /dev/stdout: broken pipe`.
          # `head` did it, and `grep -q` does it just as much, which is how
          # this step failed twice. Command substitution reads to the end,
          # so there is no pipe to break.
          help=$(docker run --rm "${IMAGE}:${{ needs.verify.outputs.version }}" --help)
          case "$help" in
            *"Policy and evidence kernel"*) echo "ok: the image starts" ;;
            *) echo "::error::the image started but printed no help"; exit 1 ;;
          esac
          docker run --rm --entrypoint python3.12 "${IMAGE}:${{ needs.verify.outputs.version }}" -c \
            "import qed, psycopg, pydantic, fastapi, uvicorn, cryptography, yaml, sqlite3, httpx, qed_verify; print('imports ok')"
          # The architecture's own library directory. A hardcoded triplet meant
          # the arm64 image put every library where that loader does not look.
          docker run --rm --entrypoint python3.12 "${IMAGE}:${{ needs.verify.outputs.version }}" -c \
            "import sysconfig, pathlib; triplet = sysconfig.get_config_var('MULTIARCH'); \
             path = pathlib.Path('/usr/lib') / triplet / 'libpython3.12.so.1.0'; \
             assert path.exists(), f'{path} is missing'; print(f'ok: libraries in /usr/lib/{triplet}')"

      - name: Export the digest
        if: vars.PUBLISH_GHCR == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: vars.PUBLISH_GHCR == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # One manifest list, signed, with an SBOM attested against it. Skipped
  # entirely until PUBLISH_GHCR is on, because there is nothing pushed to sign.
  # SPEC 24.1's Homebrew path: one file, no Python on the machine.
  #
  # Built per OS because PyInstaller freezes the interpreter it runs on -- there
  # is no cross-compilation. macOS gets both architectures as separate runners
  # rather than a universal2 binary, because a universal build needs universal
  # wheels for `cryptography` and `pydantic-core` and those are not what pip
  # resolves by default.
  #
  # The formula in `valqore/tap` points at these assets by their checksums, so
  # the release has to carry the `.sha256` beside each one.
  binary:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            label: macos-arm64
          # `macos-15-intel`, not `macos-13`: GitHub retired the macOS 13
          # image on 2025-12-04. A retired label is not rejected when the job
          # is created, it is queued -- so both of v1.0.0's first two tags
          # built every artifact, went green everywhere else, and then waited
          # on a runner that was never coming. `release` lists `binary` in
          # `needs`, and `if: always()` only survives a job that *fails*; a job
          # that never starts holds the release until GitHub cancels it at the
          # 24-hour queue limit. So a runner label is a dependency like any
          # other, and changing one is a thing to prove on a branch rather than
          # on a tag. This one was: `uname -m` = x86_64 on macOS 15.
          - runner: macos-15-intel
            label: macos-x86_64
          - runner: ubuntu-latest
            label: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e packages/qed-verify

      # macOS only, for a specific reason. `cryptography` no longer ships an
      # x86_64 macOS wheel, so on the Intel runner pip builds it from source
      # against Homebrew's OpenSSL -- and PyInstaller then collects a
      # *mismatched pair*: `libssl` from the python.org framework and
      # `libcrypto` from Homebrew's Cellar. v1.0.0's third tag shipped exactly
      # that and the binary died on startup with
      # `Symbol not found: _SSL_get0_group_name`, an OpenSSL 3.2 symbol that
      # the framework's copy does not have.
      #
      # A wheel has OpenSSL linked statically, so there is no pair to get
      # wrong. On arm64 this reinstalls the version it already had; on Intel it
      # pins back to the newest release that still publishes a universal2
      # wheel, which is a genuine difference between the two macOS binaries and
      # is printed here so the build log says which is which.
      - name: Take `cryptography` from a wheel, never a local build
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          pip install --force-reinstall --no-deps --only-binary :all: cryptography
          version=$(pip show cryptography | awk '/^Version:/{print $2}')
          so=$(python -c "import cryptography.hazmat.bindings._rust as m; print(m.__file__)")
          echo "cryptography ${version}"
          # Saying this now is worth more than a dlopen traceback out of the
          # frozen binary later: a dynamic OpenSSL link here *is* the defect.
          if otool -L "$so" | grep -E "libssl|libcrypto"; then
            echo "::error::this cryptography links OpenSSL dynamically, so PyInstaller will bundle whichever copy it finds first -- the frozen binary will not start"
            exit 1
          fi
          echo "ok: OpenSSL is static inside the extension"

      - name: Build
        run: pyinstaller deploy/qed.spec --noconfirm --clean --log-level WARN

      # Not "it built". The commands a brew user runs, against a real chain,
      # on the machine the binary was built for -- which is the only place the
      # bundled data files and the frozen imports can actually be checked.
      - name: It decides and the chain verifies
        env:
          # `rich` styles its output and folds it at the terminal width. A fold
          # inside one of the phrases below would fail a check that is actually
          # satisfied, so the width is pinned wide and the colour switched off.
          NO_COLOR: "1"
          COLUMNS: "200"
        run: |
          set -euo pipefail

          # Command substitution rather than `| grep -q`, for the reason the
          # image job above already gives: `grep -q` exits on its first match
          # and closes the pipe, the producer dies on EPIPE, and `pipefail`
          # fails the step although the match succeeded. Two runs in twenty
          # locally -- which is how v1.0.0's first tag died here, on
          # linux-x86_64 and macos-arm64, with a binary that was fine. The fix
          # was written seventy lines above in week 10 and never applied here.
          expect() {
            case "$2" in
              *"$1"*) echo "ok: $1" ;;
              *) echo "::error::expected \"$1\" in the output below"; printf '%s\n' "$2"; exit 1 ;;
            esac
          }

          expect "Policy and evidence kernel" "$(./dist/qed --help)"
          expect "46 rules" "$(./dist/qed policy lint)"
          # Safe as a pipe: `python` reads stdin to the end, so nothing closes
          # it early.
          ./dist/qed packs list --json | python -c "import json,sys; assert len(json.load(sys.stdin)['catalogues']) == 10"
          ./dist/qed keys init --dir /tmp/qed-binary
          set +e
          ./dist/qed check examples/proposals/prod-db-drop.json --dir /tmp/qed-binary
          code=$?
          set -e
          case "$code" in
            0|2|3) echo "ok: the kernel decided (exit $code)" ;;
            *) echo "::error::the binary could not decide (exit $code)"; exit 1 ;;
          esac
          expect "OK" "$(./dist/qed verify --dir /tmp/qed-binary)"

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          mv qed "qed-${{ needs.verify.outputs.version }}-${{ matrix.label }}"
          shasum -a 256 "qed-${{ needs.verify.outputs.version }}-${{ matrix.label }}" \
            > "qed-${{ needs.verify.outputs.version }}-${{ matrix.label }}.sha256"
          cat *.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.label }}
          path: |
            dist/qed-*
          if-no-files-found: error

  sign:
    needs: [verify, image]
    if: vars.PUBLISH_GHCR == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign: OIDC -> Fulcio
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # The index-level annotation is what GitHub's package->repo linker
          # reads; without it the package stays linked to whichever repo first
          # published it.
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/valqore/qed" \
            --annotation "index:org.opencontainers.image.description=Policy and evidence kernel for AI-agent actions. Apache-2.0." \
            -t "${IMAGE}:${{ needs.verify.outputs.version }}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Resolve the list digest
        id: digest
        run: |
          echo "digest=$(docker buildx imagetools inspect ${IMAGE}:${{ needs.verify.outputs.version }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: Sign, keyless
        run: cosign sign --yes "${IMAGE}@${{ steps.digest.outputs.digest }}"

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest the SBOM
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${{ steps.digest.outputs.digest }}"

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

  # ---------------------------------------------------------------------------
  chart:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Lint and package
        run: |
          set -euo pipefail
          helm lint deploy/helm/qed --set signingKey.existingSecret=qed-signing-key
          helm package deploy/helm/qed -d chart
          ls chart/*.tgz

      - name: Push to the OCI registry
        if: vars.PUBLISH_GHCR == 'true'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push chart/qed-${{ needs.verify.outputs.version }}.tgz oci://ghcr.io/valqore/charts

      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: chart/*.tgz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  pypi:
    needs: [verify, wheels]
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing; no API token to leak
    steps:
      # Two uploads, each from its own directory. Trusted publishing is scoped
      # per project, so a single call carrying both projects' files is
      # rejected -- and a rejection halfway through is a release where one of
      # the two is public and the other is not.
      - uses: actions/download-artifact@v7
        with:
          name: dist-qed
          path: dist-qed

      - uses: actions/download-artifact@v7
        with:
          name: dist-qed-verify
          path: dist-qed-verify

      - name: valqore-qed
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-qed

      - name: qed-verify
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-qed-verify

  # ---------------------------------------------------------------------------
  # Always. A release with the artifacts attached is useful even when nothing
  # is published anywhere: it is how somebody installs this today.
  release:
    needs: [verify, wheels, chart, binary]
    # The binaries are part of the release but not a condition of it: a
    # PyInstaller failure on one runner should not withhold the wheels and the
    # chart, and `download-artifact` with `merge-multiple` simply gets fewer
    # files. Whether a binary is missing is visible in the asset list, which is
    # the right place for it to be visible.
    if: always() && needs.wheels.result == 'success' && needs.chart.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Named, not everything. `docker/build-push-action` uploads a
      # `*.dockerbuild` build record per image job, and an unfiltered download
      # takes those too: on v1.0.0's third tag the five real artifacts
      # downloaded and the two build records failed, so the release died on
      # files that were never going to be attached to it. The pattern also
      # means a new artifact somewhere else in the pipeline cannot silently
      # become a release asset.
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: "{dist-*,chart,binary-*}"
          merge-multiple: true

      # The changelog section for this version, which says *why* rather than
      # listing commits. It has to be the versioned section and not
      # `[Unreleased]`: a release built from `[Unreleased]` ships notes that
      # change the next time anybody edits the file, and the entries for the
      # release are then filed under a heading that says they are not in one.
      - name: Notes from the changelog
        id: notes
        run: |
          set -euo pipefail
          python - <<'PY' > notes.md
          import pathlib
          import re
          import sys

          version = "${{ needs.verify.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## |\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              print(
                  f"::error::CHANGELOG.md has no `## [{version}]` section. "
                  "Move the `[Unreleased]` entries under it before tagging -- "
                  "notes built from `[Unreleased]` change the next time anybody "
                  "edits the file.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          body = match.group(1).strip()

          # GitHub accepts 125,000 characters. Cut at a heading rather than
          # mid-sentence, and say so, because a release note that stops in the
          # middle of a word reads as a broken pipeline.
          LIMIT = 100_000
          if len(body) > LIMIT:
              cut = body.rfind("\n###", 0, LIMIT)
              body = body[: cut if cut > 0 else LIMIT].rstrip()
              body += "\n\n---\n\nTruncated. The full entry is in `CHANGELOG.md`."
          print(body)
          PY
          echo "notes: $(wc -c < notes.md) bytes"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ needs.verify.outputs.version }}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file notes.md \
            --prerelease \
            artifacts/* || gh release upload "$tag" artifacts/* --clobber

      - name: Summary
        run: |
          {
            echo "### qed ${{ needs.verify.outputs.version }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| wheels | attached to the release |"
            echo "| helm chart | attached to the release |"
            echo "| image published | \`${{ vars.PUBLISH_GHCR == 'true' }}\` |"
            echo "| wheels published to PyPI | \`${{ vars.PUBLISH_PYPI == 'true' }}\` |"
            echo
            if [ "${{ vars.PUBLISH_GHCR }}" != "true" ]; then
              echo "Publishing is off. The image was built and started but not pushed;"
              echo "set the \`PUBLISH_GHCR\` repository variable to \`true\` once the GHCR"
              echo "name is reserved and the package has been made public."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
