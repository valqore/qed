# TEMPORARY. Deleted before this branch merges.
#
# Proves that `macos-15` exists and is arm64, before a tag depends on it.
# `release.yml` says a runner label is a dependency like any other and changing
# one is a thing to prove on a branch -- this is that proof.
name: runner-proof
on:
  workflow_dispatch:

jobs:
  arch:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - run: |
          echo "label=${{ matrix.runner }}"
          echo "uname -m = $(uname -m)"
          echo "sw_vers  = $(sw_vers -productVersion)"
