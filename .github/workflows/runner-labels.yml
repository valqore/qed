# Is every runner `release.yml` asks for still a runner GitHub serves?
#
# This exists because the answer went from yes to no twice, silently, and both
# times the discovery was a release.
#
# `macos-13` cost v1.0.0 two tags: the job was queued against a label with no
# machines and waited for a runner that was never coming, holding the release
# until GitHub cancelled it at the 24-hour queue limit. `macos-14` cost v1.1.0
# its `macos-arm64` binary: that job was cancelled in the same second it
# started, with no runner and no steps, so the *run* reported `cancelled` while
# every publishing job inside it reported success -- which is how a release
# goes out to PyPI, GHCR, the chart registry and a GitHub release while
# quietly missing one asset.
#
# `macos-14` was not retired when that happened, and the first version of this
# comment said it was. It was deprecated, due to retire on 2026-11-02, and in
# the capacity reduction GitHub warned would precede the date. This workflow
# probed it on 2026-11-02 at 11:47 UTC and got a real runner in four seconds
# (image `macos-14-arm64`/20260831.0302.1, arm64). So what this file watches
# for is not only retirement: it is a label that will not run a job, whatever
# the reason, which is the only part a release can feel.
#
# A comment in `release.yml` recorded the first lesson accurately and did not
# prevent the second. A label is a dependency, and a dependency nothing checks
# is a dependency that breaks on the day it matters most. So it is checked
# here, weekly, away from a tag: a retirement then shows up as a failing
# scheduled run on an ordinary Monday rather than as a missing artifact in a
# release that has already published everything else.
#
# `tests/deploy/test_binary.py` asserts this matrix and `release.yml`'s set of
# labels are the same set. Adding a runner there without adding it here would
# make this file reassuring and wrong.
name: runner-labels

on:
  schedule:
    # Monday 06:00 UTC. A retirement is announced weeks ahead and brownouts run
    # for days before the date, so weekly is early enough to act on and quiet
    # enough that a failure means something.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      # Nothing is built. The question is only whether a machine with this
      # label exists and will run a step; the architecture is printed because
      # `macos-15-intel` and `macos-15` differ in nothing else, and a label
      # that silently changed architecture would break the binaries without
      # breaking the build.
      - name: Say what this runner is
        run: |
          echo "label   = ${{ matrix.runner }}"
          echo "arch    = $(uname -m)"
          echo "kernel  = $(uname -s)"

  # A probe against a label that will not run is *cancelled*, not failed, and a
  # cancelled run is easy to read as somebody pressing a button. This turns it
  # into a failure, which is the only state that reliably reaches a maintainer.
  #
  # The test is `!= "success"`, so cancelled and failed take the same branch.
  # Proved on a throwaway branch on 2026-11-02 (run 41440411755) by forcing one
  # probe to exit 1: `verdict` ran on `if: always()`, read `probe result:
  # failure`, and exited 1, so the run read `failure`. Until then this job had
  # only ever been green, which says nothing about what it does when it is not
  # -- the same defect as a comment that records a lesson without guarding it.
  verdict:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every label answered
        run: |
          result="${{ needs.probe.result }}"
          echo "probe result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::A runner label release.yml depends on did not run (${result})."
            echo "::error::Cancelled with no runner and no steps means the label"
            echo "::error::would not run a job -- retired, in a brownout, or out of capacity."
            echo "::error::Check https://github.blog/changelog/ and fix the matrix in"
            echo "::error::release.yml AND in this workflow -- tests/deploy/test_binary.py"
            echo "::error::asserts the two lists are the same set."
            exit 1
          fi
