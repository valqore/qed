name: CI

on:
  schedule:
    # 06:40 UTC daily, for the `audit` job: a vulnerability in a pinned
    # dependency does not wait for somebody to push. Off-peak minute so it is
    # not competing with every other cron on the hour.
    - cron: "40 6 * * *"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SPEC.md 25.1. Runs as its own job, not in the matrix: one scan of the whole
  # history is the point, and four matrix cells scanning the same commits adds
  # nothing. `fetch-depth: 0` is required — `gitleaks detect` walks commits, and
  # the default shallow checkout would scan only the tip.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pinned. An unpinned scanner changes the rule set under you, so a
          # build that passed yesterday fails today for no change of ours.
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: No secret in any commit
        run: gitleaks detect --config=.gitleaks.toml --redact --no-banner -v

      - name: No secret in the working tree
        run: gitleaks detect --no-git --config=.gitleaks.toml --redact --no-banner -v

      # The allowlist in .gitleaks.toml names four non-secrets by value. If it
      # ever becomes a blanket exemption for tests/ the two steps above keep
      # passing and stop meaning anything, so prove the scanner still bites.
      - name: A planted credential must fail the scan
        run: |
          set -euo pipefail
          # Assembled from two halves on purpose. Written as one literal, the
          # canary is itself a finding and this workflow file fails the scan.
          canary="AKIA""3KL9ZQ7XW2VNBM4P"
          printf 'LEAK = "%s"\n' "$canary" > tests/_canary.py
          if gitleaks detect --no-git --config=.gitleaks.toml --redact --no-banner; then
            echo "FAIL: gitleaks ignored a planted AWS key in tests/"
            exit 1
          fi
          rm tests/_canary.py
          echo "ok: the scanner is still live"

  # SPEC 17's last MUST: "Dependencies pinned; `pip-audit` in CI." It was the
  # only one of the nine with nothing behind it.
  #
  # Its own job rather than a step in `check`, for two reasons. It fails for
  # reasons that have nothing to do with the code -- an advisory published
  # overnight turns a green commit red with no change of ours -- and when that
  # happens the useful information is "which dependency, which advisory", not
  # "the test matrix is red". And the schedule above runs it against a tree
  # nobody touched, which is the case that matters: a vulnerability in a pinned
  # dependency does not wait for a commit.
  # SPEC 25.1 requires a DCO sign-off on this repository. It was required and
  # unchecked for sixty-four commits, none of which carried the line. The
  # pre-publication history rewrite added it to every commit, so there is no
  # cutoff to carve out here any more.
  #
  # This job still looks only at the commits a pull request adds, because that
  # is what a DCO is for: a certification by somebody who is not the
  # maintainer, made at the moment they offer the change.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole range, not a shallow tip: this walks every commit the PR
          # adds, and a shallow clone has no merge base to diff against.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::$sha is not signed off: $(git log -1 --format='%s' "$sha")"
              missing=$((missing + 1))
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          if [ "$missing" -gt 0 ]; then
            echo "" >&2
            echo "$missing commit(s) without a Signed-off-by line." >&2
            echo "Add them with:  git rebase --signoff $BASE" >&2
            echo "See CONTRIBUTING.md; the certificate is at developercertificate.org." >&2
            exit 1
          fi
          echo "ok: every commit in this pull request is signed off"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e packages/qed-verify
          pip install pip-audit==2.9.0

      # Two audits, because they answer different questions and neither answers
      # both.
      #
      # The environment audit covers the versions actually installed, including
      # transitive ones -- which is where a vulnerability usually turns up, in
      # something nothing in `pyproject.toml` names. It cannot run `--strict`:
      # `valqore-qed` and `qed-verify` are editable installs, `--strict` treats
      # anything it could not audit as a failure, and "skipped" is not
      # "audited". So this one is allowed to skip our own packages, which have
      # no PyPI advisories to find.
      - name: Audit the installed environment
        run: pip-audit --skip-editable --progress-spinner=off

      # The declared-set audit is the strict one. It resolves exactly the
      # dependencies this project chose, so nothing can be quietly left out:
      # "no known vulnerabilities" over a set that silently excluded a package
      # is the answer nobody wants, and the step above is the one that could
      # produce it.
      - name: Audit the declared dependencies, strictly
        run: |
          set -euo pipefail
          python - <<'PY' > requirements-declared.txt
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text("utf-8"))["project"]
          lines = list(project.get("dependencies", []))
          # `dev` only. The `ui` extra is an AGPL wheel from another repository
          # (SPEC 20.4) and is audited where it is built.
          lines += project.get("optional-dependencies", {}).get("dev", [])
          print("\n".join(lines))
          PY
          cat requirements-declared.txt
          pip-audit --strict --progress-spinner=off -r requirements-declared.txt

  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because two week-1 bugs were platform
        # specific: `key_id` contains a colon (not a legal filename), and the
        # default console encoding cannot print the characters the CLI used.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e packages/qed-verify

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy

      # No QED_TEST_POSTGRES_DSN here on purpose: these cells prove the
      # product works with psycopg *not installed*, which is how almost
      # everyone will run it. The `postgres` job below covers the other half.
      #
      # `not slow` leaves out the container build -- it has its own job, once,
      # rather than four cells building the same image. `not perf` leaves out
      # the timing assertions, which are meaningless here: four parallel jobs
      # on one runner measure the runner, and a GitHub Windows runner's disk
      # puts SQLite's per-append fsync at 20 ms, so p95 lands near 105 ms
      # against a 50 ms budget. That is a real number about that hardware
      # (docs/performance.md says so) and not a regression in qed.
      - name: Tests
        run: pytest -q -m "not slow and not perf"

      - name: Week 1 exit criterion end to end
        shell: bash
        run: |
          set -euo pipefail
          qed keys init --dir ci-qed
          qed check examples/proposals/prod-db-drop.json --dir ci-qed --json

          # The example mandate is a *template*: unsigned, meant to be signed.
          # This step used to pass it straight to `--mandate` and get a verdict,
          # which it could only do because nothing verified the signature -- the
          # bug `verify_session_mandate` fixes. Sign it first, which is also what
          # an operator does.
          qed mandate sign examples/mandates/sre-agent.json --dir ci-qed \
            --out ci-mandate.json > /dev/null
          qed check examples/proposals/open-ingress.json --dir ci-qed --json \
            --mandate ci-mandate.json

          # And a forged one must be refused. Asserted here as well as in
          # `tests/delegation/test_mandate_is_verified_at_runtime.py`, because
          # this step drives the *installed* console script rather than the
          # source tree -- the distinction `docs/validation.md` is about.
          python - <<'FORGE'
          import json, pathlib
          document = json.loads(pathlib.Path("ci-mandate.json").read_text())
          document["signature"]["sig"] = "A" * 86
          pathlib.Path("ci-mandate-forged.json").write_text(json.dumps(document))
          FORGE
          # Deliberately a proposal id nothing has decided yet. Reusing
          # `open-ingress` here made this exit 1 for the wrong reason --
          # DuplicateProposal, not the forgery -- which is the trap
          # `docs/validation.md` calls "use a fresh proposal id each time".
          if qed check examples/proposals/github-read.json --dir ci-qed --json \
               --mandate ci-mandate-forged.json; then
            echo "::error::a forged mandate was accepted"
            exit 1
          fi
          echo "ok: the forged mandate was refused"
          qed check examples/proposals/github-read.json --dir ci-qed --json
          qed checkpoint --dir ci-qed --force
          qed export --dir ci-qed --out ci-chain.jsonl
          qed-verify ci-chain.jsonl --keys ci-qed/public --instance-id qed-local

      - name: A tampered chain must fail verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          lines = pathlib.Path("ci-chain.jsonl").read_text().splitlines()
          i, record = next(
              (i, json.loads(line))
              for i, line in enumerate(lines)
              if json.loads(line)["type"] == "verdict"
          )
          record["payload"]["verdict"]["decision"] = "ALLOW"
          lines[i] = json.dumps(record)
          pathlib.Path("ci-tampered.jsonl").write_text("\n".join(lines) + "\n")
          PY
          if qed-verify ci-tampered.jsonl --keys ci-qed/public; then
            echo "FAIL: the verifier accepted a tampered chain"
            exit 1
          fi
          echo "ok: tampering was detected"

      # SPEC 22 week 2: `qed mcp -- <server>` in shadow against a real MCP
      # server. tests/adapters/upstream_server.py is a real MCP server process
      # speaking the real protocol; this drives it through the CLI the way an
      # agent would, then verifies the chain the proxy wrote.
      - name: Week 2 exit criterion -- MCP proxy in shadow, end to end
        shell: bash
        run: |
          set -euo pipefail
          qed keys init --dir ci-mcp
          python - <<'PY'
          import anyio, sys
          from mcp import ClientSession, StdioServerParameters, stdio_client

          PROXY = StdioServerParameters(
              command=sys.executable,
              args=[
                  "-c", "from qed.cli import main; main()", "mcp",
                  "--dir", "ci-mcp", "--env", "prod",
                  "--server-name", "orders",
                  "--human", "ci@example.com",
                  "--target-template", "db:{env}/{args.table}",
                  "--", sys.executable, "tests/adapters/upstream_server.py",
              ],
          )

          async def main() -> None:
              async with stdio_client(PROXY) as (read, write):
                  async with ClientSession(read, write, read_timeout_seconds=60) as client:
                      init = await client.initialize()
                      assert init.server_info.name == "orders-db", init.server_info
                      tools = await client.list_tools()
                      assert "execute_sql" in [t.name for t in tools.tools]

                      result = await client.call_tool(
                          "execute_sql",
                          {"sql": "DROP TABLE orders_archive;", "table": "orders_archive"},
                      )
                      # Shadow mode: decided, recorded, forwarded.
                      assert not result.is_error, result.content
                      await client.read_resource("db://orders/schema")

          anyio.run(main)
          print("ok: the proxy forwarded a call in shadow mode")
          PY

          qed export --dir ci-mcp --out ci-mcp-chain.jsonl
          qed-verify ci-mcp-chain.jsonl --keys ci-mcp/public --instance-id qed-local

          python - <<'PY'
          import json, pathlib
          records = [
              json.loads(line)
              for line in pathlib.Path("ci-mcp-chain.jsonl").read_text().splitlines()
              if line.strip()
          ]
          by_type: dict[str, list[dict]] = {}
          for record in records:
              by_type.setdefault(record["type"], []).append(record)

          verdicts = by_type["verdict"]
          assert len(verdicts) == 2, [r["type"] for r in records]
          assert all(v["mode"] == "shadow" for v in verdicts), "shadow mode was not recorded"

          tool_call = verdicts[0]["payload"]["verdict"]
          assert tool_call["decision"] == "REQUIRE_APPROVAL", tool_call["decision"]
          assert "AG-BLR-003" in [h["rule_id"] for h in tool_call["hits"]], tool_call["hits"]
          assert tool_call["blast_radius"] >= 60, tool_call["blast_radius"]

          assert by_type["execution_result"][0]["payload"]["status"] == "ok"
          assert by_type["execution_result"][0]["assurance"] == "adapter"
          print("ok: a destructive payload under a mild tool name routed to approval")
          PY

      # SPEC 10.8: the OSCAL export MUST validate against the NIST schema.
      # Also run outside pytest, so the shipped CLI path is covered.
      - name: OSCAL export validates against the vendored NIST schema
        shell: bash
        run: |
          set -euo pipefail
          qed export --dir ci-mcp --format oscal --out ci-oscal.json
          python - <<'PY'
          import hashlib, json, pathlib, sys
          sys.path.insert(0, "tests")
          from oscal import build_validator

          schema_path = pathlib.Path("tests/oscal/oscal_assessment-results_schema.json")
          raw = schema_path.read_bytes()
          expected = "d033da70154cf6625ae46a746199e88e58f2928b1387dfac051d381b92f41b0d"
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == expected, f"the vendored NIST schema changed: {actual}"

          document = json.loads(pathlib.Path("ci-oscal.json").read_text(encoding="utf-8"))
          errors = sorted(
              build_validator(json.loads(raw.decode("utf-8"))).iter_errors(document),
              key=lambda e: list(e.path),
          )
          for error in errors[:20]:
              print("/".join(str(p) for p in error.path), error.message)
          assert not errors, f"{len(errors)} OSCAL validation error(s)"
          print("ok: valid OSCAL 1.1.2 assessment-results")
          PY

      # Both serve steps redirect the server's output to a file. A backgrounded
      # process that inherits the step's stdout keeps the pipe open, and the
      # runner then waits for it after the script has finished.
      - name: qed serve answers readyz
        shell: bash
        run: |
          set -euo pipefail
          qed serve --dir ci-mcp --host 127.0.0.1 --port 8711 --dev \
            > ci-serve.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8711/readyz" >/dev/null 2>&1; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then
              echo "FAIL: the server exited before answering"
              cat ci-serve.log
              exit 1
            fi
            sleep 1
          done

          curl -fsS "http://127.0.0.1:8711/healthz" > ci-healthz.json || {
            cat ci-serve.log; exit 1; }
          curl -fsS "http://127.0.0.1:8711/readyz" > ci-readyz.json || {
            cat ci-serve.log; exit 1; }
          python - <<'PY'
          import json, pathlib
          body = json.loads(pathlib.Path("ci-readyz.json").read_text())
          assert body["ready"] is True, body
          assert body["checks"]["signing_key"] is True, body
          assert body["checks"]["policy_bundle"] is True, body
          print("ok: readyz is true with a signing key")
          PY

      - name: readyz is false without a signing key (SPEC 17)
        shell: bash
        run: |
          set -euo pipefail
          qed serve --dir ci-no-keys --host 127.0.0.1 --port 8712 --dev \
            > ci-serve-nokeys.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8712/healthz" >/dev/null 2>&1; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then
              echo "FAIL: the server exited instead of reporting why it is not ready"
              cat ci-serve-nokeys.log
              exit 1
            fi
            sleep 1
          done

          # Alive, because restarting the container would not conjure up a key.
          curl -fsS "http://127.0.0.1:8712/healthz" >/dev/null

          code=$(curl -s -o ci-readyz-nokeys.json -w '%{http_code}' \
            "http://127.0.0.1:8712/readyz")
          if [ "$code" != "503" ]; then
            echo "FAIL: readyz answered $code without a signing key"
            cat ci-readyz-nokeys.json
            exit 1
          fi
          grep -q "signing key" ci-readyz-nokeys.json
          echo "ok: no signing key means not ready"

      # This step used to assert the opposite: no licence file until SPEC 24.2
      # closed. 24.2 is answered, so the invariant inverts. What can go wrong
      # now is a licence that quietly disappears from one of the two projects,
      # the PyPI guard rail coming back and failing a release, or the
      # qed-verify copy of LICENSE drifting from the original — it is a copy
      # because PEP 639 `license-files` globs cannot escape a project
      # directory, and a verifier shipped under a stale licence text is
      # exactly the kind of detail an auditor checks.
      - name: Apache-2.0 is applied to both projects, consistently
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f NOTICE
          test -f packages/qed-verify/NOTICE
          grep -q "Version 2.0, January 2004" LICENSE
          cmp LICENSE packages/qed-verify/LICENSE

          for f in pyproject.toml packages/qed-verify/pyproject.toml; do
            grep -qx 'license = "Apache-2.0"' "$f" || {
              echo "FAIL: $f does not declare the Apache-2.0 SPDX expression"
              exit 1
            }
            if grep -q "Private :: Do Not Upload" "$f"; then
              echo "FAIL: the pre-publication PyPI guard rail is back in $f"
              exit 1
            fi
          done

          test ! -f PATENT-AND-LICENCE-QED.md
          echo "ok: Apache-2.0, both projects, one licence text"

  # The Postgres backend (SPEC 15). Its own job rather than a matrix cell,
  # because service containers run only on Linux runners and a conditional
  # `image:` on the Windows cells would depend on how the runner reads an
  # unset expression. One job that says what it does is worth more than one
  # matrix that needs explaining.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # AWS's public mirror of the same official image. Docker Hub's
        # unauthenticated pull limit is per runner IP and shared across every
        # repository on it, so `postgres:17` fails several times a day with
        # `toomanyrequests` -- a failure that looks like ours and is not.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_PASSWORD: qed-ci
          POSTGRES_DB: qed_test
        ports:
          - 5432:5432
        # Without the health check the job races the server's startup, and the
        # first connection fails on a cold image pull.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      QED_TEST_POSTGRES_DSN: postgresql://postgres:qed-ci@127.0.0.1:5432/qed_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install, with the postgres extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]" -e packages/qed-verify

      # The whole suite, not only the cross-backend file: every test that
      # touches the store now runs its SQLite path with psycopg importable,
      # which is the combination a Postgres deployment actually has.
      - name: Tests
        run: pytest -q -m "not slow and not perf"

      # A test that skips itself proves nothing, and the DSN plumbing is
      # exactly the kind of wiring that silently stops working.
      - name: The Postgres tests really ran
        run: |
          set -euo pipefail
          pytest tests/evidence/test_cross_backend.py -q -p no:cacheprovider | tee /tmp/pg.txt
          grep -qE "[0-9]+ passed" /tmp/pg.txt
          if grep -q skipped /tmp/pg.txt; then
            echo "they skipped: QED_TEST_POSTGRES_DSN is not reaching them" >&2
            exit 1
          fi

      # SPEC 18's p95 budget and SPEC 849's throughput floor. Here rather
      # than in the matrix because a timing assertion on four parallel jobs on
      # one runner measures the runner -- and because this job is the only one
      # with a database, so it covers both backends in one pass.
      #
      # The thresholds are loose on purpose: p95 against 50 ms with a measured
      # 4.5 ms, and a floor of 80 decisions/s against a measured 250. A test
      # that failed at 45 ms would be a test somebody disables.
      - name: Decision latency and throughput
        run: pytest tests/perf -q -m perf -s

      # The product, not just the store: decide a proposal against Postgres,
      # export it, and verify the export with the standalone verifier, which
      # has never heard of either backend.
      - name: A chain written to Postgres verifies
        run: |
          set -euo pipefail

          # The suite leaves a chain behind, under its own instance_id. A
          # chain's genesis hash is bound to that identity and the kernel
          # refuses to continue it as somebody else (`InstanceMismatch`) --
          # correctly, which is why this step starts from an empty schema
          # rather than depending on which test ran last.
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["QED_TEST_POSTGRES_DSN"], autocommit=True) as conn:
              conn.execute("DROP SCHEMA public CASCADE")
              conn.execute("CREATE SCHEMA public")
              conn.execute("GRANT ALL ON SCHEMA public TO public")
          print("schema reset")
          PY

          mkdir -p /tmp/pg-e2e
          printf 'instance_id: qed-ci-pg\nmode: enforce\nevidence:\n  store_env: QED_DATABASE_URL\n' \
            > /tmp/pg-e2e/qed.yaml
          export QED_DATABASE_URL="$QED_TEST_POSTGRES_DSN"
          qed keys init --dir /tmp/pg-e2e/qed
          qed check examples/proposals/prod-db-drop.json \
            --dir /tmp/pg-e2e/qed --config /tmp/pg-e2e/qed.yaml || true
          qed export --dir /tmp/pg-e2e/qed --config /tmp/pg-e2e/qed.yaml > /tmp/pg-e2e/chain.jsonl
          test -s /tmp/pg-e2e/chain.jsonl
          qed-verify /tmp/pg-e2e/chain.jsonl --keys /tmp/pg-e2e/qed/public

  # The deployment artifacts: the Helm chart and the container (SPEC 20.4,
  # 104, 24). Its own job because both need tools the matrix cells do not --
  # `helm`, and a Docker daemon -- and because building the image four times
  # to learn the same thing is four times the minutes.
  #
  # This job exists because of two bugs that every other check was blind to.
  # The runtime base was `distroless/python3-debian12`, which ships Python
  # 3.11 against a 3.12 wheel, so the image could not import pydantic. And
  # `compliance/frameworks.yaml` was missing from `package-data`, so the image
  # started and then died on its first request. Both passed every static
  # check, both failed the moment anybody ran the thing.
  # SPEC 26's docs site. A separate job because it is the one artifact a reader
  # consumes directly, and because `--strict` turns a dead cross-reference into
  # a failure -- which is the whole reason to build it in CI rather than trust
  # that the links in twenty-odd Markdown files still resolve.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The static half: the nav and `docs/` are the same set, in both
      # directions. A page missing from the nav is published and unreachable by
      # browsing, which is a green build and a wrong artifact -- the same shape
      # as the wheel that shipped without its catalogue files.
      - name: The nav agrees with the docs
        run: pytest tests/docs -q -p no:cacheprovider

      # The real half. `test_it_builds` is marked slow, so it does not run
      # above; run the build itself rather than relying on a marker.
      - name: Build the site
        run: python -m mkdocs build --strict

      - name: Every page rendered
        run: |
          set -euo pipefail
          pages=$(find site -name index.html | wc -l)
          echo "built $pages page(s)"
          test "$pages" -ge 40
          # A snippet that did not resolve renders its own marker as text, and
          # the build still succeeds. That shipped once as a wheel missing a
          # data file; it is not shipping as a spec page that is one line long.
          if grep -rl '8<--' site >/dev/null 2>&1; then
            echo "::error::a snippet include did not resolve" >&2
            exit 1
          fi
          grep -q "Policy language" site/spec/index.html
          grep -q "STRIDE" site/threat-model/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e packages/qed-verify

      - uses: azure/setup-helm@v5
        with:
          # Pinned: `helm template` output is what the chart tests parse, and
          # an unpinned release changes the renderer under them.
          version: v3.16.3

      # binfmt, so the container tests can build and *start* the other
      # architecture. Without it that test skips -- and skipping is how the
      # arm64 image shipped broken: `/usr/lib/x86_64-linux-gnu` was hardcoded,
      # every library landed where aarch64's loader does not look, and nothing
      # noticed because the tests only ever built for the host. The emulated
      # build costs a few minutes; a release that builds two architectures
      # should test two.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Helm lint
        run: helm lint deploy/helm/qed --set signingKey.existingSecret=qed-signing-key

      # Includes the container build (`-m slow`), which is what this job is
      # really for. `QED_BUILDER_IMAGE` points the build at AWS's mirror of
      # the same official Python image, for the same reason the Postgres
      # service container does.
      # Once, not twice: this used to run as two steps, which built the
      # container twice for one result.
      #
      # `QED_REQUIRE_EMULATION` matters because this job installs the emulator
      # itself a step earlier. Without it the arm64 tests *skip* when the probe
      # cannot start a foreign image -- including when the probe simply failed
      # to pull -- and a skip here is a green run with the test that caught the
      # last arm64 bug not having run. With it they run and fail by name.
      #
      # The skip guard stays for everything else: helm or Docker not reaching
      # the tests is the other way this job passes without testing anything.
      - name: Chart and container tests
        env:
          QED_BUILDER_IMAGE: public.ecr.aws/docker/library/python:3.12-slim-bookworm
          QED_REQUIRE_EMULATION: "1"
        run: |
          set -euo pipefail
          pytest tests/deploy -q -p no:cacheprovider | tee /tmp/deploy.txt
          if grep -qE "[0-9]+ skipped" /tmp/deploy.txt; then
            echo "something skipped: helm or Docker is not reaching the tests" >&2
            exit 1
          fi

      - name: The compose stack is valid
        run: docker compose -f deploy/docker-compose.yml config --quiet

      # A chart that renders is not a chart that installs. The refusals are
      # the chart's most load-bearing feature -- two replicas on SQLite fork
      # the evidence chain -- so prove they still fire.
      - name: The chart refuses what it must refuse
        run: |
          set -euo pipefail
          if helm template qed deploy/helm/qed > /dev/null 2>&1; then
            echo "FAIL: the chart installed without an evidence signing key"
            exit 1
          fi
          if helm template qed deploy/helm/qed \
              --set signingKey.existingSecret=k --set replicaCount=2 > /dev/null 2>&1; then
            echo "FAIL: the chart accepted two replicas on SQLite"
            exit 1
          fi
          echo "ok: the chart still refuses both"
