# Dependency updates. SPEC §20 pins versions and `pip-audit` runs in CI; this is
# the half that proposes the bump rather than reporting the vulnerability.
#
# Weekly, not daily: a trust-layer project with one maintainer gains nothing
# from a queue of pull requests nobody can review attentively, and an
# unreviewed dependency bump is a supply-chain change merged on trust.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    # Only change a requirement when the new version falls OUTSIDE it.
    #
    # The default for pip without a lockfile is `increase`, which raises a
    # lower bound every time anything ships -- and for a `>=` floor that is
    # definitionally unnecessary, because the floor already permits the new
    # version. On 2026-10-19 it produced a pull request raising
    # `hypothesis>=6.170.0` to `>=6.170.1`, opened within the hour of the
    # previous raise being merged, carrying no information and costing a
    # 16-minute CI round plus a staleness cascade across every other open
    # branch.
    #
    # A security fix still arrives: a vulnerability that requires a version
    # outside the declared range is outside it, which is the condition this
    # strategy acts on.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      # Tooling moves constantly and cannot affect a published record. One pull
      # request for the lot.
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "types-*", "hypothesis", "coverage*"]
        dependency-type: development
      docs:
        patterns: ["mkdocs*", "pymdown*"]
    ignore:
      # `cryptography` is the one dependency that can change what a signature
      # means. Majors are read by hand, against the changelog, before the bump
      # is proposed -- never merged because CI went green.
      #
      # This rule said `update-types: ["version-update:semver-major"]` until
      # 2026-10-19, and it did not hold: Dependabot opened a pull request
      # raising the verifier's floor from `cryptography>=42` to `>=50.0.2` --
      # eight majors at once -- described as "to permit the latest version".
      # A lower bound has no single current version to classify, so the
      # semver-major filter never applied to the requirement form of the
      # update, only to the version form. Ignoring the dependency outright is
      # what the comment above always meant. It costs nothing: `pip-audit` in
      # CI is what reports a vulnerability in this package, and this file is
      # only the half that proposes a bump.
      - dependency-name: cryptography

  - package-ecosystem: pip
    directory: /packages/qed-verify
    # Only change a requirement when the new version falls OUTSIDE it.
    #
    # The default for pip without a lockfile is `increase`, which raises a
    # lower bound every time anything ships -- and for a `>=` floor that is
    # definitionally unnecessary, because the floor already permits the new
    # version. On 2026-10-19 it produced a pull request raising
    # `hypothesis>=6.170.0` to `>=6.170.1`, opened within the hour of the
    # previous raise being merged, carrying no information and costing a
    # 16-minute CI round plus a staleness cascade across every other open
    # branch.
    #
    # A security fix still arrives: a vulnerability that requires a version
    # outside the declared range is outside it, which is the condition this
    # strategy acts on.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, verifier]
    commit-message:
      prefix: "deps(qed-verify)"
    ignore:
      #
      # This rule said `update-types: ["version-update:semver-major"]` until
      # 2026-10-19, and it did not hold: Dependabot opened a pull request
      # raising the verifier's floor from `cryptography>=42` to `>=50.0.2` --
      # eight majors at once -- described as "to permit the latest version".
      # A lower bound has no single current version to classify, so the
      # semver-major filter never applied to the requirement form of the
      # update, only to the version form. Ignoring the dependency outright is
      # what the comment above always meant. It costs nothing: `pip-audit` in
      # CI is what reports a vulnerability in this package, and this file is
      # only the half that proposes a bump.
      - dependency-name: cryptography

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      # Five separate pull requests for five action bumps in one week, each
      # needing its own run of a pipeline that does not exercise the actions
      # it changed. One pull request is the same review, read once.
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, deploy]
    commit-message:
      prefix: "deploy"
