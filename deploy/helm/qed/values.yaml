# Defaults for the qed chart.
#
# Two choices here are deliberately *not* convenient, and both are the same
# choice twice: the chart will not invent an evidence signing key, and it will
# not run more than one replica on SQLite. Everything else has a working
# default.

replicaCount: 1

image:
  repository: ghcr.io/valqore/qed
  # Empty means "use .Chart.AppVersion". A chart whose default is `latest`
  # installs something different every week, and the chain records
  # `engine_version` for every decision it makes.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# qed.yaml
# ---------------------------------------------------------------------------
# Rendered into a ConfigMap and mounted read-only. Anything the schema accepts
# goes here *except* secrets: every credential is named by environment
# variable, so this file stays safe to commit and to read with `kubectl get
# configmap -o yaml`.
config:
  instance_id: qed
  # `shadow` on purpose. A kernel installed in enforce mode starts refusing
  # actions before anybody has seen what its rules do, and the first thing an
  # operator learns about QED should not be an outage. SPEC §22 week 2's
  # criterion is shadow→enforce as a config change, which is this line.
  mode: shadow
  default_verdict: ALLOW
  environment_profile: prod
  evidence:
    masking: default

# Extra environment variables, for the credentials `config` refers to by name.
# Adapter secrets are not among them -- `adapters` below wires those itself:
#   extraEnv:
#     - name: QED_SLACK_SIGNING_SECRET
#       valueFrom:
#         secretKeyRef: {name: qed-slack, key: signing-secret}
extraEnv: []
extraEnvFrom: []

# ---------------------------------------------------------------------------
# Evidence signing key (SPEC §17)
# ---------------------------------------------------------------------------
# `readyz` is false without one, and the pod will say so rather than start
# deciding. The chart does not generate one: a key created by an install hook
# lives in whatever the hook wrote it to, and a key created per pod would start
# a new chain on every restart whose genesis claimed to be the same instance.
#
#   qed keys init --dir ./qed-keys
#   kubectl create secret generic qed-signing-key \
#     --from-file=evidence-key.pem=./qed-keys/evidence-key.pem
#
# Keep ./qed-keys/public/ -- that is what an auditor verifies an export
# with, and it is the half that is safe to publish.
signingKey:
  # Name of an existing secret holding the private key. Required.
  existingSecret: ""
  # The key within that secret. Only the private half is mounted: the
  # public one is derived from it, and the `public/` directory exists for
  # `qed-verify`, which reads an export rather than a running instance.
  privateKeyKey: evidence-key.pem

# ---------------------------------------------------------------------------
# Adapter authentication (SPEC §13, §17)
# ---------------------------------------------------------------------------
# The *other* thing `readyz` is false without, and the one that is easy to miss
# because nothing on the cluster says the word "adapter". SPEC §17 requires
# unknown adapters to be rejected; an instance holding no adapter secret cannot
# tell one caller from another, so it refuses every proposal with
# `adapter-auth-unconfigured` and never becomes ready. So the chart refuses to
# install without one, exactly as it refuses to install without a signing key.
#
# There is no way to fix this from inside the pod: `qed.yaml` is a read-only
# ConfigMap mount, so `qed adapters add` has nothing it can write to.
# Registration here is a chart value plus a Secret.
#
#   kubectl create secret generic qed-adapters \
#     --from-literal=mcp-proxy="$(openssl rand -base64 32)"
#
#   adapters:
#     existingSecret: qed-adapters
#     registered:
#       - id: mcp-proxy
#
# `--dev`, where signatures are accepted unverified, is deliberately not
# offered: it is for a loopback process, and anything this chart installs has a
# Service in front of it.
adapters:
  # Name of an existing Secret holding one shared secret per adapter. Required
  # as soon as `registered` has an entry. The secrets never reach a manifest:
  # the chart names the variable and Kubernetes supplies the value, the same
  # arrangement as the Postgres DSN.
  existingSecret: ""

  # One entry per adapter allowed to send proposals. The id is what the caller
  # puts in `X-QED-Adapter-Id` and what the evidence records, so it wants to
  # name a thing that exists -- a process, a CI job, a laptop -- rather than a
  # person.
  #
  #   registered:
  #     - id: mcp-proxy
  #       # Key within existingSecret. Defaults to the id.
  #       secretKey: mcp-proxy
  #       # Recorded in evidence; `mcp` unless you have a reason.
  #       kind: mcp
  #       # The *old* key, while a rotation is in flight. Both secrets are
  #       # accepted until you remove this, which is the overlap a rotation
  #       # needs: a shared secret cannot change on two machines at the same
  #       # instant, and refusing the old one before the fleet has restarted
  #       # turns a rotation into an outage.
  #       previousSecretKey: ""
  registered: []

# ---------------------------------------------------------------------------
# Evidence store
# ---------------------------------------------------------------------------
# `sqlite` is one process writing for itself: zero configuration, and a hard
# ceiling of one replica. `postgres` is what SPEC §15 and §104 are about --
# every replica decides, exactly one holds the advisory lock and drains the
# outbox into the chain (ADR-0009).
evidence:
  backend: sqlite # sqlite | postgres

  sqlite:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
      accessMode: ReadWriteOnce
      existingClaim: ""

  postgres:
    # The DSN never appears in a manifest: it carries a password, and the
    # config file names the variable instead (`store_env`).
    existingSecret: ""
    secretKey: dsn
    env: QED_DATABASE_URL

# ---------------------------------------------------------------------------
# Policies
# ---------------------------------------------------------------------------
# The baseline pack ships in the image and is always loaded. These are the
# operator's own rules on top of it.
policies:
  # Name of a ConfigMap whose keys are YAML rule files.
  existingConfigMap: ""
  mountPath: /etc/qed/policies

service:
  type: ClusterIP
  port: 8710
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: qed.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

# Matches the container's own `USER 65532:65532` (distroless nonroot). Set
# here as well so a cluster with a restrictive admission policy sees it
# declared rather than inherited.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# `readyz` is the gate: it is false without a signing key and false with a
# broken policy bundle, so a bad rollout stops at the first pod instead of
# replacing a working deployment with one that cannot decide.
probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5

podDisruptionBudget:
  # Only meaningful above one replica, which only Postgres allows.
  enabled: false
  minAvailable: 1

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
