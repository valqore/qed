{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qed.serviceAccountName" . }}
  labels:
    {{- include "qed.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# QED calls no Kubernetes API, so it gets no token. One mounted anyway would be
# a credential in a pod that has no use for it.
automountServiceAccountToken: false
{{- end }}
