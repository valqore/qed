{{- if and (eq .Values.evidence.backend "sqlite") .Values.evidence.sqlite.persistence.enabled (not .Values.evidence.sqlite.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qed.fullname" . }}-state
  labels:
    {{- include "qed.labels" . | nindent 4 }}
  annotations:
    # Kept when the release is uninstalled. The chain is the evidence: an
    # auditor asking about a decision from six months ago is asking about a
    # record `helm uninstall` would otherwise have deleted. Remove the claim
    # deliberately, after exporting.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.evidence.sqlite.persistence.accessMode }}
  {{- with .Values.evidence.sqlite.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.evidence.sqlite.persistence.size }}
{{- end }}
