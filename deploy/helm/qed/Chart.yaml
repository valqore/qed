# SPEC §104 (HA), §20.4 (container), §24 (distribution: Helm OCI chart).
apiVersion: v2
name: qed
description: >-
  Valqore QED — a policy and evidence kernel for AI-agent actions. Every
  replica serves the API and decides; exactly one drains the evidence outbox
  into the hash-chained ledger.
type: application

# The chart's own version. Bumped on a template change even when the app is
# unchanged, because that is what `helm diff` compares.
version: 0.6.0

# Tracks the qed release this chart was written against. Overridable with
# `image.tag`, but the default is pinned: a chart whose default is `latest`
# installs something different every week and makes the evidence chain's
# `engine_version` unpredictable.
appVersion: "0.6.0"

home: https://github.com/valqore/qed
sources:
  - https://github.com/valqore/qed
keywords:
  - governance
  - policy
  - audit
  - ai-agents
maintainers:
  - name: Valqore
    url: https://github.com/valqore
annotations:
  artifacthub.io/license: Apache-2.0
