[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-verify"
version = "0.1.0.dev1"
description = "Independent verifier for gate evidence chains"
requires-python = ">=3.12"
# `license-files` globs are resolved inside this project directory, so the
# root LICENSE and NOTICE are copied here rather than referenced upwards. CI
# asserts the copies are byte-identical to the originals.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = ["Programming Language :: Python :: 3.12"]
# One dependency, on purpose: an auditor must be able to install this on a
# machine that is not allowed to reach the internet twice.
dependencies = ["cryptography>=42"]

[project.scripts]
gate-verify = "gate_verify.cli:main"

[tool.setuptools]
packages = ["gate_verify"]
