# Golden policy cases (SPEC §21).
#
# Each case is a deep-merge patch over tests/conftest.py::BASE_PROPOSAL plus the
# expected outcome. `rules` is the EXACT sorted set of rule ids in the verdict,
# so a case fails both when a rule stops firing and when an unrelated rule
# starts firing — the second kind is what catches an accidentally widened rule.
#
# `blast_radius` is asserted only where the arithmetic is worth pinning; the
# table itself is covered exhaustively in tests/policy/test_blast_radius.py.
#
# The base proposal is a read-only GitHub call in dev: nothing should fire.

# ---------------------------------------------------------------- default path
- id: def-001-plain-read-allows
  patch: {}
  expect:
    decision: ALLOW
    would: ALLOW
    rules: [AG-DEF-001]
    default_applied: true
    blast_radius: 10

- id: def-001-staging-read-allows
  patch: { context: { environment: staging } }
  expect:
    decision: ALLOW
    would: ALLOW
    rules: [AG-DEF-001]
    blast_radius: 15

- id: def-001-prod-read-allows
  patch: { context: { environment: prod } }
  expect:
    decision: ALLOW
    would: ALLOW
    rules: [AG-DEF-001]
    blast_radius: 25

